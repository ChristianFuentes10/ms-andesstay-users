spring.application.name=ms-andesstay-users

# H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Cognito (valores dummy para tests; el JwtDecoder se mockea)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_TESTPOOL
cognito.app-client-id=test-client-id
cognito.admin.enabled=false
cognito.region=us-east-1
cognito.user-pool-id=us-east-1_TESTPOOL
security.default-role=HUESPED

cors.allowed-origins=http://localhost:4200
cors.enabled=true

users.bootstrap-admin.email=

management.endpoints.web.exposure.include=health
