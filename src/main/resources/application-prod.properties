spring.application.name=ms-andesstay-users
server.port=${SERVER_PORT:8085}

# --- Conexion a PostgreSQL (RDS) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# En produccion NO se modifica el schema con JPA; se usa schema.sql (idempotente)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.sql.init.mode=always

# --- Seguridad: AWS Cognito ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID}
cognito.admin.enabled=${COGNITO_ADMIN_ENABLED:true}
cognito.region=${COGNITO_REGION}
cognito.user-pool-id=${COGNITO_USER_POOL_ID}

# --- Apache Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.topic.reporteria=${KAFKA_TOPIC_REPORTERIA:reporteria-eventos}

# --- CORS ---
cors.allowed-origins=${FRONTEND_URL}
cors.enabled=${CORS_ENABLED:false}

# --- Swagger apagado en produccion ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Logging razonable para produccion ---
logging.level.root=WARN
logging.level.cl.duoc.andesstay.users=INFO
logging.level.org.springframework.security=WARN
