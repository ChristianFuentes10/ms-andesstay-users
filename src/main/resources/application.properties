spring.application.name=ms-andesstay-users
server.port=${SERVER_PORT:8085}

# --- Conexion a PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/andesstay_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Inicializacion SQL (schema.sql): en Docker Compose se monta en /docker-entrypoint-initdb.d/
# En ejecucion manual puede activarse con SQL_INIT_MODE=always
spring.sql.init.mode=${SQL_INIT_MODE:never}

# --- Seguridad: AWS Cognito (mismo User Pool que BFF, catalog, reservations y audit) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:us-east-1_l3aNhIuac}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:74j0mqos66t7sk4no848krtjbc}
# Rol asignado a usuarios sin grupos en Cognito (recien registrados)
security.default-role=${DEFAULT_ROLE:HUESPED}

# --- Integracion de administracion con Cognito (alta de usuarios y sincronizacion de grupos) ---
# false = solo base local (desarrollo/AWS Academy lab sin permisos IAM). true = requiere permisos IAM cognito-idp:Admin* sobre el User Pool.
cognito.admin.enabled=${COGNITO_ADMIN_ENABLED:false}
cognito.region=${COGNITO_REGION:us-east-1}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_l3aNhIuac}

# --- Primer administrador (opcional, idempotente) ---
users.bootstrap-admin.email=${USERS_BOOTSTRAP_ADMIN_EMAIL:}
users.bootstrap-admin.nombre=${USERS_BOOTSTRAP_ADMIN_NOMBRE:Administrador}

# --- CORS ---
# Si el API Gateway ya inyecta headers CORS, poner CORS_ENABLED=false
cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}
cors.enabled=${CORS_ENABLED:true}

# --- Actuator + Prometheus (monitoring/ de reservations ya scrapea /actuator/prometheus) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=ms-andesstay-users

# --- Apache Kafka (Producer, Consumer) ---
# Kafka compartido: 2 brokers (kafka-1:29092,kafka-2:29093 dentro de andesstay-net; localhost:9092/9093 desde host)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:users-events-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.missing-topics-fatal=false
kafka.topic.reporteria=${KAFKA_TOPIC_REPORTERIA:users.events}
kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topic.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:2}

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs

# --- Logging con traceId (X-Trace-Id) ---
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-}]
