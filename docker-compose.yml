services:
  # ==========================================
  # Base de Datos PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: andesstay-users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: andesstay_users
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 5435 en el host para no chocar con catalog (5432) ni reservations (5433)
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d andesstay_users"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - andesstay-net

  # ==========================================
  # Microservicio ms-andesstay-users (Spring Boot)
  # ==========================================
  users-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-andesstay-users
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/andesstay_users
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:29092,kafka-2:29093}
      KAFKA_TOPIC_REPORTERIA: ${KAFKA_TOPIC_REPORTERIA:-users.events}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-users-events-group}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-2}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-us-east-1_l3aNhIuac}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-74j0mqos66t7sk4no848krtjbc}
      COGNITO_ADMIN_ENABLED: ${COGNITO_ADMIN_ENABLED:-false}
      USERS_BOOTSTRAP_ADMIN_EMAIL: ${USERS_BOOTSTRAP_ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    networks:
      - andesstay-net

volumes:
  postgres_data:
    name: andesstay_users_pgdata

networks:
  andesstay-net:
    external: true
