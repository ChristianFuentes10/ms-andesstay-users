services:
  # ==============================================================
  # Base de Datos PostgreSQL dedicada para Usuarios
  # Puerto 5435 en el host para no colisionar con catalog (5432) ni reservations (5433)
  # ==============================================================
  postgres:
    image: postgres:16-alpine
    container_name: andesstay-users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: andesstay_users
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d andesstay_users"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - andesstay-net

  # ==============================================================
  # Microservicio ms-andesstay-users (Spring Boot 3)
  # Conectado a la red compartida andesstay-net y cluster Kafka compartido
  # ==============================================================
  users-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-andesstay-users
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://andesstay-users-db:5432/andesstay_users}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Cluster Kafka compartido (2 brokers en red andesstay-net)
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:29092,kafka-2:29093}
      # Topico dedicado de usuarios (no usa reporteria-eventos para no interferir con reservations/DLT)
      KAFKA_TOPIC_USERS_EVENTS: ${KAFKA_TOPIC_USERS_EVENTS:-users.events}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-2}
      # AWS Cognito
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-us-east-1_l3aNhIuac}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-CHANGE_ME}
      COGNITO_ADMIN_ENABLED: ${COGNITO_ADMIN_ENABLED:-false}
      USERS_BOOTSTRAP_ADMIN_EMAIL: ${USERS_BOOTSTRAP_ADMIN_EMAIL:-}
      # Frontend & CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    networks:
      - andesstay-net

volumes:
  postgres_data:
    name: andesstay_users_pgdata

networks:
  andesstay-net:
    name: andesstay-net
    external: true
