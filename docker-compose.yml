services:
  # ==========================================
  # Base de Datos PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: andesstay-users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: andesstay_users
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 5435 en el host para no chocar con catalog (5432) ni reservations (5433)
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d andesstay_users"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - andesstay-network

  # ==========================================
  # Apache Kafka + Zookeeper (Rubrica Entrega 3)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: andesstay-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - andesstay-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: andesstay-kafka-broker
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - andesstay-network

  # ==========================================
  # Kafka-UI (Administracion de Brokers y Topicos)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: andesstay-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: andesstay-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - andesstay-network

  # ==========================================
  # Monitoreo: Prometheus + Grafana
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: andesstay-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - andesstay-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: andesstay-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Permite incrustar dashboards en iframe desde Angular sin bloqueo CORS ni X-Frame-Options
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - andesstay-network

  # ==========================================
  # Microservicio ms-andesstay-users (Spring Boot)
  # ==========================================
  users-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-andesstay-users
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/andesstay_users
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_REPORTERIA: reporteria-eventos
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-CHANGE_ME}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-CHANGE_ME}
      COGNITO_ADMIN_ENABLED: ${COGNITO_ADMIN_ENABLED:-false}
      USERS_BOOTSTRAP_ADMIN_EMAIL: ${USERS_BOOTSTRAP_ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    networks:
      - andesstay-network

volumes:
  postgres_data:
    name: andesstay_users_pgdata
  grafana_data:
    name: andesstay_grafana_data

networks:
  andesstay-network:
    name: andesstay-net
    driver: bridge
